# =====================================================================
#  Legal Contract Risk Analyzer — Risk Rules  (v2)
#  File: configs/risk_rules.yaml
#
#  HOW A FLAG IS RAISED (per clause, per rule)
#   1. The NLP model predicts a LEDGAR label for the clause (e.g. "Terminations").
#   2. Patterns are matched against the clause text (case-insensitive,
#      whole words / whole phrases only — "assign" does NOT match "assigned").
#   3. If ANY exclude_pattern matches, the rule is skipped for that clause.
#   4. require_pattern: true  -> a risky phrase MUST appear. The label alone
#                                is not enough (normal clauses are not risky).
#      require_pattern: false -> the model label alone can raise the flag,
#                                but only if model confidence >= min_confidence.
#   5. Labels must be spelled EXACTLY like the 100 LEDGAR labels
#      (see reports/ledgar_labels.txt).
#
#  HOW THE OVERALL SCORE IS CALCULATED (see `scoring` below)
#   - Flags are grouped by flag_type. Each category counts ONCE:
#        category_points = weight(severity) x best_confidence
#                          + repeat bonus (10% per extra clause, max 30%)
#   - raw = sum of category_points
#   - overall = 100 x (1 - e^(-raw / k))   -> grows fast for the first risks,
#     then slows down; it can never reach 100 just by repeating flags.
#
#  This tool is for triage only — it is NOT legal advice.
# =====================================================================

version: 2

disclaimer: >-
  This report is an automated risk triage generated by an NLP model and
  rule engine. It is not legal advice and does not replace review by a
  qualified lawyer.

# ---------------------------------------------------------------------
# Points per severity (before confidence scaling)
# ---------------------------------------------------------------------
severity_weights:
  low: 8
  medium: 16
  high: 28
  critical: 40

# ---------------------------------------------------------------------
# Model confidence handling
# ---------------------------------------------------------------------
uncertainty:
  low_confidence_threshold: 0.55   # below this a category is marked "needs review"
  penalty: 4                       # added ONCE per category whose best confidence < threshold

# ---------------------------------------------------------------------
# Matching behaviour
# ---------------------------------------------------------------------
matching:
  case_sensitive: false
  word_boundaries: true            # wrap every literal pattern in \b ... \b
  label_match: exact               # exact LEDGAR label (case-insensitive), no substring
  default_min_confidence: 0.55     # used when a rule has no min_confidence
  pattern_only_confidence: 0.70    # confidence given when only a pattern matched
  label_and_pattern_confidence: 0.90  # when both the label and a pattern matched
  max_flags_per_clause_per_rule: 1

# ---------------------------------------------------------------------
# Overall score
# ---------------------------------------------------------------------
scoring:
  mode: saturating                 # 100 * (1 - exp(-raw / saturation_k))
  per_category: max                # one value per flag_type (best confidence)
  repeat_bonus: 0.10               # +10% of weight per extra clause in same category
  repeat_bonus_cap: 0.30           # at most +30% of weight
  saturation_k: 90                 # higher k = lower scores overall
  round_to: 1

# Approximate results with k = 90:
#   one medium risk  (16)  -> ~16
#   one critical risk (40) -> ~36
#   3 medium + 1 high (76) -> ~57
#   2 critical + 2 high (136) -> ~78

bands:
  - { name: Low,      min: 0,  max: 30,  color: "#2e7d32", action: "Standard review is enough." }
  - { name: Medium,   min: 30, max: 60,  color: "#f9a825", action: "Negotiate the flagged clauses before signing." }
  - { name: High,     min: 60, max: 80,  color: "#ef6c00", action: "Get legal review before signing." }
  - { name: Critical, min: 80, max: 100, color: "#c62828", action: "Do not sign without a lawyer's review and changes." }

general_recommendations:
  no_flags: "No configured risk indicators were detected. A quick human review is still recommended."
  always:
    - "Confirm the names of the parties, dates, amounts and notice addresses are correct."
    - "Keep a signed copy and all annexures/schedules together."

# =====================================================================
#  RULES
#  Fields: flag_type, title, severity, labels, patterns, regex_patterns,
#          exclude_patterns, require_pattern, min_confidence, reason,
#          recommendation
# =====================================================================
rules:

  # ------------------------------ LIABILITY ---------------------------
  - flag_type: UNLIMITED_LIABILITY
    title: "Unlimited or uncapped liability"
    severity: critical
    labels: []
    require_pattern: true
    patterns:
      - "unlimited liability"
      - "liability shall be unlimited"
      - "without any limitation of liability"
      - "no limitation of liability"
      - "liable for all losses"
      - "liable for any and all losses"
      - "liable for any and all damages"
      - "fully and solely liable"
      - "shall be solely liable"
      - "jointly and severally liable"
      - "personally liable"
    regex_patterns: []
    exclude_patterns:
      - "shall not exceed"
      - "aggregate liability"
      - "limited to the fees paid"
      - "limited to the amount paid"
    reason: "One party may have to pay unlimited amounts for losses, with no cap."
    recommendation: "Ask for a liability cap (for example, 12 months of fees or the contract value) and exclude indirect losses."

  - flag_type: ONE_SIDED_LIABILITY_CAP
    title: "One-sided limitation or exclusion of liability"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "in no event shall the company be liable"
      - "in no event shall the service provider be liable"
      - "in no event shall the provider be liable"
      - "in no event shall the landlord be liable"
      - "in no event shall the licensor be liable"
      - "under no circumstances shall the company"
      - "shall not be liable for any loss"
      - "shall not be liable for any damages"
      - "liability is limited to"
    regex_patterns: []
    exclude_patterns:
      - "neither party shall be liable"
      - "neither party will be liable"
      - "each party's liability"
    reason: "One party limits or excludes its own liability, which can leave the other party without a remedy."
    recommendation: "Make the limitation mutual, and keep carve-outs for fraud, gross negligence, data breach and confidentiality."

  # ---------------------------- INDEMNITY -----------------------------
  - flag_type: BROAD_INDEMNITY
    title: "Broad or one-sided indemnity"
    severity: high
    labels: ["Indemnifications", "Indemnity"]
    require_pattern: false
    min_confidence: 0.60
    patterns:
      - "indemnify, defend and hold harmless"
      - "defend, indemnify and hold harmless"
      - "indemnify and hold harmless"
      - "indemnify and keep indemnified"
      - "any and all claims"
      - "regardless of negligence"
      - "whether or not caused by"
      - "including reasonable attorneys' fees"
      - "including attorneys' fees"
    regex_patterns: []
    exclude_patterns:
      - "each party shall indemnify"
      - "each party agrees to indemnify"
      - "mutually indemnify"
    reason: "One party must cover the other's losses and legal costs, possibly even for claims it did not cause."
    recommendation: "Limit the indemnity to claims caused by your own breach or negligence, make it mutual, and put it under the liability cap."

  # ------------------------- RESTRICTIVE COVENANTS --------------------
  - flag_type: NON_COMPETE
    title: "Non-compete / restraint of trade"
    severity: critical
    labels: []
    require_pattern: true
    patterns:
      - "shall not compete"
      - "agrees not to compete"
      - "not to compete"
      - "non-compete"
      - "non-competition"
      - "competing business"
      - "competitive business"
      - "restraint of trade"
      - "shall not directly or indirectly engage"
    regex_patterns:
      - 'for a period of [\w\s()]{1,20}(years?|months?) (after|following|from) (the )?(termination|expiry|end)'
    exclude_patterns: []
    reason: "Restricts the party from working in or running a competing business, sometimes after the contract ends."
    recommendation: "Narrow the duration, geography and activities. In India, post-contract non-competes are generally unenforceable under Section 27 of the Indian Contract Act; get legal advice."

  - flag_type: NON_SOLICITATION
    title: "Non-solicitation of employees or customers"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "shall not solicit"
      - "agrees not to solicit"
      - "non-solicitation"
      - "not to solicit"
      - "shall not hire"
      - "shall not employ or engage"
      - "induce any employee"
    regex_patterns: []
    exclude_patterns: []
    reason: "Limits hiring the other party's staff or approaching its customers."
    recommendation: "Limit it to 6–12 months and to people you actually worked with; exclude general job advertisements."

  - flag_type: NON_DISPARAGEMENT
    title: "Non-disparagement"
    severity: low
    labels: ["Non-Disparagement"]
    require_pattern: false
    min_confidence: 0.65
    patterns:
      - "shall not disparage"
      - "non-disparagement"
      - "make any negative statement"
    regex_patterns: []
    exclude_patterns: []
    reason: "Restricts what the party may say publicly about the other party."
    recommendation: "Make it mutual and exclude truthful statements required by law or regulators."

  # ----------------------------- TERMINATION ---------------------------
  - flag_type: TERMINATION_WITHOUT_CAUSE
    title: "Termination at will / without notice"
    severity: high
    labels: ["Terminations"]
    require_pattern: true
    patterns:
      - "terminate at any time"
      - "terminate this agreement at any time"
      - "without cause"
      - "for convenience"
      - "without assigning any reason"
      - "without giving any reason"
      - "with immediate effect"
      - "without prior notice"
      - "without any notice"
      - "forthwith terminate"
    regex_patterns: []
    exclude_patterns:
      - "material breach"
    reason: "The contract can be ended suddenly, leaving the other party without time to arrange alternatives."
    recommendation: "Ask for a written notice period (30–90 days), the same termination right for both parties, and payment for work already done."

  - flag_type: AUTO_RENEWAL
    title: "Automatic renewal"
    severity: high
    labels: ["Terms"]
    require_pattern: true
    patterns:
      - "automatically renew"
      - "automatically renewed"
      - "auto-renew"
      - "auto renew"
      - "renew automatically"
      - "deemed to be renewed"
      - "deemed renewed"
      - "successive renewal terms"
      - "evergreen"
    regex_patterns: []
    exclude_patterns: []
    reason: "The contract renews by itself unless cancelled in time, which can lock the party into further payments."
    recommendation: "Put the cancellation deadline in your calendar, ask for renewal reminders, and require written consent to renew."

  - flag_type: LOCK_IN_PERIOD
    title: "Lock-in period / early-exit charges"
    severity: medium
    labels: ["Terminations", "Terms"]
    require_pattern: true
    patterns:
      - "lock-in period"
      - "lock in period"
      - "early termination fee"
      - "early termination charges"
      - "minimum term of"
      - "shall not terminate during"
    regex_patterns: []
    exclude_patterns: []
    reason: "The party cannot leave early without paying, even if circumstances change."
    recommendation: "Keep the lock-in short, and make sure it applies to both parties with a fair exit charge."

  - flag_type: UNILATERAL_SUSPENSION
    title: "Unilateral suspension of service or access"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "suspend the services"
      - "suspend access"
      - "suspend or terminate your account"
      - "disable your account"
      - "disconnect the electricity"
      - "disconnect the water"
      - "cut off the supply"
    regex_patterns: []
    exclude_patterns: []
    reason: "Service, access or utilities can be stopped by one side."
    recommendation: "Require prior written notice and a cure period (for example, 15 days) before any suspension."

  # ---------------------------- CHANGES & CONTROL ----------------------
  - flag_type: UNILATERAL_AMENDMENT
    title: "One party can change the contract"
    severity: high
    labels: ["Amendments", "Modifications"]
    require_pattern: true
    patterns:
      - "may amend this agreement at any time"
      - "reserves the right to modify"
      - "reserves the right to change"
      - "reserves the right to amend"
      - "may modify these terms"
      - "may change these terms"
      - "without notice to you"
      - "effective upon posting"
      - "continued use constitutes acceptance"
    regex_patterns: []
    exclude_patterns:
      - "signed by both parties"
      - "mutual written agreement"
      - "in writing signed by"
    reason: "Terms can be changed by one party without the other's agreement."
    recommendation: "Require any change to be in writing and signed by both parties, or allow you to exit without penalty if terms change."

  - flag_type: SOLE_DISCRETION
    title: "Decisions at one party's sole discretion"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "sole discretion"
      - "absolute discretion"
      - "sole and absolute discretion"
      - "as it deems fit"
      - "as it may deem fit"
      - "decision shall be final and binding"
    regex_patterns: []
    exclude_patterns: []
    reason: "One party can decide important matters without objective criteria."
    recommendation: "Replace with 'reasonable discretion' or define clear criteria for the decision."

  - flag_type: CHANGE_OF_CONTROL
    title: "Change of control"
    severity: high
    labels: ["Change In Control"]
    require_pattern: false
    min_confidence: 0.60
    patterns:
      - "change of control"
      - "change in control"
      - "merger or acquisition"
      - "sale of all or substantially all"
    regex_patterns: []
    exclude_patterns: []
    reason: "Rights can change or the contract can end if a party is sold or merged."
    recommendation: "Check what happens on a merger or sale, and ask for notice plus the right to terminate if the new owner is a competitor."

  - flag_type: ASSIGNMENT_WITHOUT_CONSENT
    title: "Free assignment by one party"
    severity: medium
    labels: ["Assignments", "Assigns", "Successors"]
    require_pattern: true
    patterns:
      - "may freely assign"
      - "may assign this agreement without"
      - "may assign or transfer"
      - "may assign its rights"
      - "without the consent of the other party"
      - "without requiring the consent"
    regex_patterns: []
    exclude_patterns: []
    reason: "The contract can be transferred to an unknown third party."
    recommendation: "Require prior written consent for assignment by either party, except to an affiliate with notice."

  - flag_type: EXCLUSIVITY
    title: "Exclusivity"
    severity: high
    labels: []
    require_pattern: true
    patterns:
      - "exclusive provider"
      - "exclusive supplier"
      - "on an exclusive basis"
      - "exclusive basis"
      - "sole and exclusive"
      - "shall not engage any other"
      - "shall not appoint any other"
      - "exclusively from"
      - "exclusively through"
    regex_patterns: []
    exclude_patterns:
      - "exclusive jurisdiction"
      - "non-exclusive"
    reason: "The party cannot work with or buy from anyone else."
    recommendation: "Limit exclusivity by time, territory and product, and link it to minimum performance targets."

  # ---------------------------- MONEY ----------------------------------
  - flag_type: LATE_PAYMENT_INTEREST
    title: "Late payment interest / penalties"
    severity: medium
    labels: ["Payments", "Fees"]
    require_pattern: true
    patterns:
      - "late payment"
      - "late fee"
      - "late charges"
      - "penal interest"
      - "overdue amounts"
      - "interest at the rate of"
    regex_patterns:
      - 'interest (at|@) ?\d+(\.\d+)? ?% ?(per (month|annum)|p\.?\s?a\.?|monthly)'
    exclude_patterns: []
    reason: "Delays in payment attract interest or extra charges."
    recommendation: "Check the rate (monthly rates add up fast), ask for a grace period, and make sure it applies to both parties."

  - flag_type: NON_REFUNDABLE_PAYMENT
    title: "Non-refundable or advance payments"
    severity: medium
    labels: ["Payments", "Fees"]
    require_pattern: true
    patterns:
      - "non-refundable"
      - "non refundable"
      - "no refund"
      - "shall not be refunded"
      - "not refundable"
      - "payable in advance"
    regex_patterns: []
    exclude_patterns: []
    reason: "Money paid may be lost even if the service is not delivered or the contract ends early."
    recommendation: "Ask for pro-rata refunds on early termination or non-performance."

  - flag_type: PRICE_ESCALATION
    title: "Price / rent escalation"
    severity: medium
    labels: ["Payments", "Fees", "Adjustments"]
    require_pattern: true
    patterns:
      - "rent shall be increased"
      - "rent shall stand increased"
      - "escalation"
      - "increase the fees"
      - "increase the price"
      - "revise the fees"
      - "prices are subject to change"
    regex_patterns:
      - 'increased? by \d+(\.\d+)? ?%'
    exclude_patterns: []
    reason: "The price can go up during the contract."
    recommendation: "Cap increases (for example, 5% per year), fix the dates, and require advance written notice."

  - flag_type: SECURITY_DEPOSIT_RISK
    title: "Security deposit forfeiture / deductions"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "security deposit shall not be refunded"
      - "deposit shall be forfeited"
      - "forfeit the security deposit"
      - "non-refundable deposit"
      - "deduct from the security deposit"
      - "adjusted against the security deposit"
    regex_patterns: []
    exclude_patterns: []
    reason: "Part or all of the deposit may be kept by the other party."
    recommendation: "Fix a refund deadline (for example, 30 days after handover), list allowed deductions, and require receipts."

  - flag_type: PENALTY_LIQUIDATED_DAMAGES
    title: "Penalties, forfeiture or liquidated damages"
    severity: high
    labels: ["Forfeitures", "Remedies"]
    require_pattern: true
    patterns:
      - "liquidated damages"
      - "by way of penalty"
      - "as a penalty"
      - "penalty of"
      - "shall pay a penalty"
      - "shall forfeit"
      - "be forfeited"
      - "forfeiture of"
    regex_patterns: []
    exclude_patterns: []
    reason: "Fixed penalties or forfeiture apply on breach or delay."
    recommendation: "Make sure the amount is a reasonable estimate of loss, capped, and applies to both sides."

  # ----------------------------- IP & DATA -----------------------------
  - flag_type: BROAD_IP_ASSIGNMENT
    title: "Broad transfer of intellectual property"
    severity: high
    labels: ["Intellectual Property"]
    require_pattern: true
    patterns:
      - "hereby assigns all right, title and interest"
      - "irrevocably assigns"
      - "work made for hire"
      - "work for hire"
      - "shall vest exclusively in"
      - "sole and exclusive property of"
      - "waives all moral rights"
      - "perpetual, irrevocable"
      - "worldwide, royalty-free"
    regex_patterns: []
    exclude_patterns: []
    reason: "Ownership or wide usage rights over work, content or IP pass to the other party, possibly forever."
    recommendation: "Keep ownership of pre-existing IP and tools, limit the transfer to paid deliverables, and get a licence back if needed."

  - flag_type: DATA_SHARING_PRIVACY
    title: "Personal data sharing / transfer"
    severity: high
    labels: ["Disclosures"]
    require_pattern: true
    patterns:
      - "share your personal data"
      - "share personal data with third parties"
      - "disclose personal information to third parties"
      - "sell personal"
      - "transfer personal data"
      - "transferred outside india"
      - "use your data for marketing"
      - "for any purpose whatsoever"
    regex_patterns: []
    exclude_patterns: []
    reason: "Personal data may be shared, sold or sent abroad."
    recommendation: "Require purpose limitation, consent, security measures and breach notification, in line with India's DPDP Act, 2023."

  - flag_type: PERPETUAL_CONFIDENTIALITY
    title: "Perpetual or very broad confidentiality"
    severity: medium
    labels: ["Confidentiality"]
    require_pattern: true
    patterns:
      - "in perpetuity"
      - "perpetual"
      - "survive indefinitely"
      - "for an indefinite period"
      - "at all times thereafter"
    regex_patterns: []
    exclude_patterns: []
    reason: "Confidentiality obligations never end, which is hard to comply with."
    recommendation: "Limit confidentiality to 2–5 years after the contract ends (trade secrets can be longer), with the standard exceptions."

  # ------------------------- DISPUTES & RIGHTS -------------------------
  - flag_type: WAIVER_OF_RIGHTS
    title: "Waiver or release of legal rights"
    severity: high
    labels: ["Waiver Of Jury Trials", "Releases"]
    require_pattern: false
    min_confidence: 0.60
    patterns:
      - "waives the right to a jury trial"
      - "waive trial by jury"
      - "waiver of jury trial"
      - "class action waiver"
      - "waives any right to participate in a class"
      - "releases and forever discharges"
      - "waives all claims"
      - "waives any and all claims"
    regex_patterns: []
    exclude_patterns: []
    reason: "The party gives up legal rights or claims."
    recommendation: "Check exactly which rights are waived; refuse blanket releases of unknown or future claims."

  - flag_type: ONE_SIDED_ARBITRATION
    title: "One-sided arbitration"
    severity: medium
    labels: ["Arbitration"]
    require_pattern: true
    patterns:
      - "sole arbitrator to be appointed by"
      - "sole arbitrator appointed by"
      - "arbitrator shall be appointed by the company"
      - "appointed solely by"
      - "costs of arbitration shall be borne by"
    regex_patterns: []
    exclude_patterns:
      - "mutually appointed"
      - "appointed by mutual consent"
      - "jointly appointed"
    reason: "One party controls who decides disputes, or the costs fall on one side."
    recommendation: "Ask for a mutually appointed arbitrator, a neutral seat and shared costs. In India, unilateral appointment has been held invalid by the Supreme Court."

  - flag_type: JURISDICTION_VENUE
    title: "Exclusive or distant jurisdiction"
    severity: low
    labels: ["Governing Laws", "Jurisdictions", "Venues", "Consent To Jurisdiction", "Submission To Jurisdiction"]
    require_pattern: true
    patterns:
      - "exclusive jurisdiction"
      - "laws of england"
      - "laws of singapore"
      - "laws of the united states"
      - "laws of the state of"
      - "courts at"
    regex_patterns: []
    exclude_patterns: []
    reason: "Disputes must be handled in a specific, possibly far-away, court or under foreign law."
    recommendation: "Check that the city and law are convenient for you; otherwise ask for your own city or a neutral one."

  - flag_type: WARRANTY_DISCLAIMER
    title: "Disclaimer of warranties"
    severity: medium
    labels: ["Warranties"]
    require_pattern: true
    patterns:
      - "as is"
      - "as available"
      - "without warranty of any kind"
      - "disclaims all warranties"
      - "makes no representations or warranties"
      - "does not warrant"
      - "no warranty"
    regex_patterns: []
    exclude_patterns: []
    reason: "No promise is given about quality, performance or fitness for purpose."
    recommendation: "Ask for basic warranties (works as described, meets service levels) and a remedy if they are not met."

  # ------------------------------ PROPERTY -----------------------------
  - flag_type: LANDLORD_ENTRY
    title: "Entry into premises without notice"
    severity: medium
    labels: []
    require_pattern: true
    patterns:
      - "enter the premises at any time"
      - "enter the premises without notice"
      - "inspect the premises at any time"
      - "access the premises at any time"
    regex_patterns: []
    exclude_patterns:
      - "reasonable prior notice"
      - "24 hours notice"
      - "prior written notice"
    reason: "The owner may enter the property at any time, affecting privacy."
    recommendation: "Require 24–48 hours' prior notice except in emergencies."
